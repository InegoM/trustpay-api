services:
  postgres:
    image: postgres:18.3-alpine
    container_name: trustpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustpay
      POSTGRES_USER: trustpay
      POSTGRES_PASSWORD: trustpay_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - trustpay-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpay -d trustpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18.3-alpine
    container_name: trustpay-postgres-test
    restart: "no"
    environment:
      POSTGRES_DB: trustpay_test
      POSTGRES_USER: trustpay
      POSTGRES_PASSWORD: trustpay_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - trustpay-postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpay -d trustpay_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trustpay-postgres-data:
  trustpay-postgres-test-data:
